[package]
name    = "box-screen-dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
eframe   = { version = "0.27", features = ["default"] }
egui     = "0.27"
reqwest  = { version = "0.12", features = ["blocking", "json"] }
serde    = { version = "1",    features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
